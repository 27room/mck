<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gear teeth -->
  <g fill="#111">
    <rect x="46" y="0" width="8" height="18"/>
    <rect x="46" y="82" width="8" height="18"/>
    <rect x="0" y="46" width="18" height="8"/>
    <rect x="82" y="46" width="18" height="8"/>
    
    <rect x="16" y="10" width="8" height="18" transform="rotate(-45 20 20)"/>
    <rect x="76" y="10" width="8" height="18" transform="rotate(45 80 20)"/>
    <rect x="16" y="72" width="8" height="18" transform="rotate(45 20 80)"/>
    <rect x="76" y="72" width="8" height="18" transform="rotate(-45 80 80)"/>
  </g>

  <!-- Gear body -->
  <circle cx="50" cy="50" r="34" fill="#222"/>
  
  <!-- Center hole -->
  <circle cx="50" cy="50" r="10" fill="white"/>
</svg>
